<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px 12px; border-bottom: 1px solid #ddd; text-align: left; }
        form.inline { display: inline; }
        .add-form { margin-top: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .add-form input { margin: 5px 0; padding: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>

    <table>
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
        {% for expense in expenses %}
        <tr>
            <td>{{ expense.title }}</td>
            <td>₹{{ expense.amount }}</td>
            <td>{{ expense.category }}</td>
            <td>{{ expense.date }}</td>
            <td>
                <form class="inline" action="/delete/{{ expense.id }}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <div class="add-form">
        <h3>Add Expense</h3>
        <form action="/add" method="post">
            <input type="text" name="title" placeholder="Title" required>
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <input type="text" name="category" placeholder="Category" required>
            <input type="date" name="expense_date" required>
            <button type="submit">Add</button>
        </form>
    </div>
</body>
</html>
